<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" width="140" height="120">
  <title>Mastexo Digital Vertical</title>
  <desc>Logo Mastexo Digital versión vertical sobre fondo oscuro</desc>
  <!-- Ícono circular centrado -->
  <g transform="translate(70,42)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="152,38" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="100,25" stroke-linecap="round" transform="rotate(50 0 0)"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="50,14" stroke-linecap="round" transform="rotate(-30 0 0)"/>
    <circle cx="0" cy="0" r="3.5" fill="#7C3AED"/>
  </g>
  <!-- Wordmark centrado -->
  <text x="70" y="92" font-family="'Space Grotesk',sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="1" text-anchor="middle">MASTE<tspan fill="#7C3AED">X</tspan>O</text>
  <text x="70" y="108" font-family="'Space Grotesk',sans-serif" font-size="9" font-weight="400" fill="#555555" letter-spacing="4" text-anchor="middle">DIGITAL</text>
</svg>
