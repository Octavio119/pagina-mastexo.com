<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="260" height="56">
  <title>Mastexo Digital</title>
  <desc>Logo Mastexo Digital horizontal sobre fondo blanco</desc>
  <rect width="260" height="56" fill="#FFFFFF"/>
  <!-- Ícono circular -->
  <g transform="translate(4,4)">
    <circle cx="24" cy="24" r="22" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="115,28" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="15" fill="none" stroke="#5B21B6" stroke-width="1.8" stroke-dasharray="76,18" stroke-linecap="round" transform="rotate(50 24 24)"/>
    <circle cx="24" cy="24" r="7" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="36,10" stroke-linecap="round" transform="rotate(-30 24 24)"/>
    <circle cx="24" cy="24" r="2.8" fill="#7C3AED"/>
  </g>
  <!-- Wordmark -->
  <text x="62" y="31" font-family="'Space Grotesk',sans-serif" font-size="26" font-weight="700" fill="#111111" letter-spacing="0.5">MASTE<tspan fill="#7C3AED">X</tspan>O</text>
  <text x="63" y="47" font-family="'Space Grotesk',sans-serif" font-size="10" font-weight="400" fill="#888888" letter-spacing="5">DIGITAL</text>
</svg>
