<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Mastexo Icon</title>
  <desc>Ícono Mastexo Digital para favicon y app icon</desc>
  <rect width="64" height="64" rx="14" fill="#7C3AED"/>
  <g transform="translate(32,32)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="2.2" stroke-dasharray="110,28" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.7" stroke-dasharray="70,18" stroke-linecap="round" transform="rotate(50 0 0)"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.3" stroke-dasharray="35,10" stroke-linecap="round" transform="rotate(-30 0 0)"/>
    <circle cx="0" cy="0" r="2.8" fill="#FFFFFF"/>
  </g>
